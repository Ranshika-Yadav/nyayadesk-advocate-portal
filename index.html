let cases=JSON.parse(localStorage.getItem('nyayadesk_cases')||'null')||seed;let view='dashboard',selected=1,query='',filter='All',courtFilter='All',collapsed=false,modal=false,editing=null,chat=[],chatCase='1';const root=document.getElementById('root');const save=()=>{localStorage.setItem('nyayadesk_cases',JSON.stringify(cases));api('/api/cases',{method:'PUT',body:JSON.stringify({cases})}).catch(()=>toast('Server sync failed'))};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>{if(!s)return 'Not set';const [y,m,d]=s.split('-');return new Date(+y,+m-1,+d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};const shortDate=s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) ;const status=s=>`<span class="badge ${s.toLowerCase()}">${esc(s)}</span>`;const nav=(v)=>{view=v;document.querySelector('.app')?.classList.remove('mobile-open');render();window.scrollTo(0,0)};const openCase=id=>{selected=Number(id);detailTab='overview';nav('detail')};const toast=t=>{document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3000)};

function caseTable(list){return `<div class="table-wrap"><table><thead><tr><th>Case Number / Matter</th><th>Client Name</th><th>Court / Tribunal</th><th>Next Hearing</th><th>Stage</th><th>Presiding Judge</th><th>Status</th><th></th></tr></thead><tbody>${list.length?list.map(c=>`<tr onclick="openCase(${c.id})" tabindex="0" onkeydown="if(event.key==='Enter')openCase(${c.id})"><td><span class="case-no">${esc(c.num)}</span><span class="minor">${esc(c.topic)}</span></td><td><span class="client">${esc(c.client)}</span></td><td>${esc(c.court)}</td><td style="font-weight:700;white-space:nowrap">${fmt(c.date)}</td><td>${esc(c.stage)}</td><td><span class="judge">${esc(c.judge)}</span><span class="minor">${esc(c.designation)} · ${esc(c.room)}</span></td><td>${status(c.status)}</td><td><button class="link" aria-label="Open case">${ico('arrow')}</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty">No cases match your search. Try changing your filters.</td></tr>`}</tbody></table></div><div class="table-foot"><span>Showing ${list.length} of ${cases.length} cases</span><span>Click any row to view case details</span></div>`}
function filtered(){return cases.filter(c=>(filter==='All'||c.status===filter)&&(courtFilter==='All'||c.court===courtFilter)&&[c.num,c.client,c.judge,c.topic,c.court].some(x=>x.toLowerCase().includes(query.toLowerCase())))}function toolbar(){return `<div class="toolbar"><label class="search">${ico('search')}<input id="search" value="${esc(query)}" placeholder="Search case number, client or judge..." oninput="query=this.value;refreshTable()" aria-label="Search cases"></label><select class="select" aria-label="Filter status" onchange="filter=this.value;refreshTable()">${['All','Urgent','Pending','Listed','Disposed'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select><select class="select" aria-label="Filter court" onchange="courtFilter=this.value;refreshTable()"><option>All</option>${[...new Set(cases.map(c=>c.court))].map(s=>`<option ${courtFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`}function refreshTable(){document.getElementById('case-table').innerHTML=caseTable(filtered())}
function dashboard(){let active=cases.filter(c=>c.status!=='Disposed'),upcoming=[...active].filter(c=>c.date>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.date.localeCompare(b.date));return header('Practice overview','Good afternoon, Advocate.','Here is your chamber’s case activity and upcoming court schedule.',`<button class="btn primary" onclick="openModal()">${ico('plus')} Add New Case</button>`)+`<div class="workspace-banner"><div><span class="eyebrow">CHAMBER WORKSPACE</span><h2>Every matter. One clear view.</h2><p>Stay prepared for the next hearing with your case register, priorities and research in one place.</p></div><div class="banner-actions"><button class="btn" onclick="exportCases()">Export register ↓</button><button class="btn primary" onclick="nav('hearings')">View calendar →</button></div></div><div class="stats">${[['Total Active Cases',active.length,'Across all courts','cases'],['Upcoming Hearings',upcoming.length,'Scheduled from today','calendar'],['Urgent Matters',active.filter(c=>c.status==='Urgent').length,'Require attention','bell'],['Disposed Cases',cases.filter(c=>c.status==='Disposed').length,'Closed matters','scale']].map(([t,n,s,i])=>`<div class="stat"><div class="stat-top"><span>${t}</span><span class="stat-icon">${ico(i)}</span></div><div class="stat-value">${n.toString().padStart(2,'0')}</div><div class="stat-bottom">${s}</div></div>`).join('')}</div><section class="panel"><div class="panel-head"><div><h2>Ongoing Case Register</h2><p class="sub">Monitor active matters and their latest proceedings</p></div><button class="link" onclick="nav('cases')">View all cases →</button></div>${toolbar()}<div id="case-table">${caseTable(filtered())}</div></section><div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>Upcoming Hearings</h2><p class="sub">Next scheduled court appearances</p></div><button class="link" onclick="nav('hearings')">Full schedule →</button></div><div class="small-list">${upcoming.slice(0,4).map(c=>`<div class="hearing-row"><div class="datebox"><b>${c.date.slice(8)}</b><small>${new Date(c.date+'T00:00:00').toLocaleString('en',{month:'short'})}</small></div><div class="grow"><strong>${esc(c.num)} · ${esc(c.client)}</strong><p>${esc(c.court)} · ${esc(c.stage)}</p></div><button class="link" onclick="openCase(${c.id})">${ico('arrow')}</button></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h2>Chamber Intelligence</h2><p class="sub">Your legal research workspace</p></div>${ico('ai')}</div><div class="notice"><strong>AI-assisted case preparation</strong><p>Explore hearing summaries, procedural checklists and argument outlines grounded in the case information you provide.</p></div><div style="padding:0 22px 22px"><button class="btn primary" style="width:100%" onclick="nav('assistant')">${ico('ai')} Open Legal Assistant</button></div></section></div>`}
function casesPage(){return header('Case management','All Cases','Search, organize and manage your chamber’s case register.',`<button class="btn primary" onclick="openModal()">${ico('plus')} Add New Case</button>`)+`<section class="panel"><div class="panel-head"><div><h2>Case Register</h2><p class="sub">${cases.length} matters in your workspace</p></div><button class="btn" onclick="exportCases()">Export CSV ↓</button></div>${toolbar()}<div id="case-table">${caseTable(filtered())}</div></section>`}
function detail(){let c=cases.find(x=>x.id===selected)||cases[0];return header('Case management',esc(c.num),`${esc(c.topic)} · ${esc(c.court)}`,`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="nav('cases')">← All Cases</button><button class="btn primary" onclick="openModal(${c.id})">${ico('edit')} Edit Case</button></div>`)+`<div class="detail-tabs" role="tablist" aria-label="Case detail sections">${[["overview","Overview"],["hearings","Hearing history"],["documents","Documents"],["provisions","Legal provisions"],["insights","AI insights"]].map(([id,label])=>`<button role="tab" aria-selected="${detailTab===id}" class="${detailTab===id?'active':''}" onclick="detailTab='${id}';render()">${label}</button>`).join("")}</div><div class="detail-grid detail-tab-${detailTab}"><div><section class="panel detail-card detail-section detail-overview" style="margin-bottom:20px"><div class="section-title"><h2 style="margin:0">Case Overview</h2>${status(c.status)}</div><div class="detail-info">${[['Client / Petitioner',c.client],['Court / Tribunal',c.court],['Next Hearing',fmt(c.date)],['Current Stage',c.stage],['Presiding Judge',c.judge],['Designation',c.designation],['Courtroom',c.room],['Matter',c.topic]].map(([l,v])=>`<div><div class="field-label">${l}</div><div class="field-val">${esc(v)}</div></div>`).join('')}</div></section><section class="panel detail-card detail-section detail-documents" style="margin-bottom:20px"><h2>Case Documents</h2><p class="sub">Attach case documents for this browser-based demo. Files are listed locally and are not uploaded to a server.</p><label class="btn" style="margin:15px 0">＋ Add document<input type="file" style="display:none" onchange="attachDocument(event,${c.id})" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg"></label><div class="document-list">${(c.documents||[]).map((d,i)=>`<div class="document-item"><span>▤ ${esc(d.name)} <small>· ${esc(d.size)}</small></span><button class="link" onclick="removeDocument(${c.id},${i})">Remove</button></div>`).join("")||'<p class="sub">No documents added yet.</p>'}</div></section><section class="panel detail-card detail-section detail-hearings"><div class="section-title"><h2 style="margin:0">Hearing History & Summaries</h2><button class="btn" onclick="addHearing(${c.id})">${ico('plus')} Add Hearing</button></div><div class="timeline">${(c.history||[]).slice().sort((a,b)=>b[0].localeCompare(a[0])).map(h=>`<div class="timeline-item"><strong>${fmt(h[0])}</strong><p>${esc(h[1])}</p></div>`).join('')||'<p class="sub">No hearing history added yet.</p>'}</div></section></div><div><section class="panel detail-card" style="margin-bottom:20px"><h2>Quick Actions</h2><button class="btn primary" style="width:100%;margin:6px 0 10px" onclick="courtLink(${c.id})">${ico('external')} Online Court Link</button><button class="btn" style="width:100%" onclick="chatCase='${c.id}';nav('assistant')">${ico('ai')} Ask AI About This Case</button><p class="sub" style="font-size:11px;margin-top:13px">Virtual hearing URLs must be verified against official court cause lists.</p></section><section class="panel detail-card detail-section detail-provisions" style="margin-bottom:20px"><h2>Applicable Acts & Provisions</h2>${c.acts.split(';').map(x=>`<span class="act">${esc(x.trim())}</span>`).join('')}<p class="sub" style="font-size:11px;margin-top:12px">Verify applicability, amendments and governing procedural law.</p></section><section class="panel detail-card detail-section detail-insights"><h2>Latest Hearing Summary</h2><p style="font-size:12px;line-height:1.9;color:#647789">${esc(c.summary||'No summary added yet.')}</p><button class="link" onclick="editSummary(${c.id})">Edit summary →</button></section></div></div>`}
function hearings(){let list=[...cases].filter(c=>c.status!=='Disposed').sort((a,b)=>a.date.localeCompare(b.date));return header('Court schedule','Hearing Calendar','Your upcoming appearances, organized by hearing date.')+`<section class="panel"><div class="panel-head"><h2>Scheduled Hearings</h2><span class="sub">${list.length} upcoming matters</span></div><div class="small-list">${list.map(c=>`<div class="hearing-row"><div class="datebox"><b>${c.date.slice(8)}</b><small>${new Date(c.date+'T00:00:00').toLocaleString('en',{month:'short'})}</small></div><div class="grow"><strong>${esc(c.num)} · ${esc(c.client)}</strong><p>${esc(c.court)} · ${esc(c.judge)} · ${esc(c.room)}</p></div>${status(c.status)}<button class="link" onclick="openCase(${c.id})">View →</button></div>`).join('')}</div></section>`}
function assistant(){let c=cases.find(x=>String(x.id)===String(chatCase))||cases[0];return header('Research workspace','AI Legal Assistant','Case-aware drafting and procedural research support.')+`<div class="ai-layout"><section class="panel ai-side"><h2>Case Context</h2><p class="sub" style="margin-bottom:13px">Choose a matter for contextual assistance.</p><select class="select" style="width:100%;margin-bottom:23px" onchange="chatCase=this.value;chat=[];render()">${cases.map(x=>`<option value="${x.id}" ${String(x.id)===String(chatCase)?'selected':''}>${esc(x.num)}</option>`).join('')}</select><h3>Suggested Questions</h3>${['What should be our next procedural step?','Prepare a hearing checklist.','Outline arguments and research issues.','Summarize the previous hearings.'].map(q=>`<button class="prompt" onclick="ask(${JSON.stringify(q).replace(/"/g,'&quot;')})">${q} →</button>`).join('')}<div class="disclaimer">Demo assistant uses rule-based templates, not a live AI model or legal database. Always independently verify legal advice, citations and court records.</div></section><section class="panel ai-main"><div class="panel-head" style="border-bottom:1px solid var(--line)"><div><h2 style="margin:0 0 4px">Legal Research Assistant</h2><p class="sub">Context: ${esc(c.num)} · ${esc(c.topic)}</p></div><span class="badge listed">Demo mode</span></div><div class="chat-scroll" id="chat-scroll">${chat.length?chat.map(m=>`<div class="bubble ${m.role}">${esc(m.text)}</div>`).join(''):`<div style="max-width:550px;margin:75px auto;text-align:center"><div style="font-size:34px;color:#315f8a">⚖</div><h2 style="margin:17px 0 10px">How can I assist your preparation?</h2><p class="sub">Ask about your case strategy, hearing history, procedural checklists or issues for legal research.</p><div class="mobile-only" style="margin-top:20px"><select class="select" style="width:100%" onchange="chatCase=this.value;chat=[];render()">${cases.map(x=>`<option value="${x.id}" ${String(x.id)===String(chatCase)?'selected':''}>${esc(x.num)}</option>`).join('')}</select></div></div>`}</div><form class="chat-input" onsubmit="event.preventDefault();let v=document.getElementById('message').value.trim();if(v)ask(v)"><textarea id="message" aria-label="Ask legal assistant" placeholder="Ask a question about this case..."></textarea><button class="btn primary" type="submit" aria-label="Send question">${ico('send')}</button></form></section></div>`}
function answer(q,c){let low=q.toLowerCase(),base=`CASE CONTEXT\n${c.num} · ${c.topic}\nCourt: ${c.court}\nStage: ${c.stage}\nNext hearing: ${fmt(c.date)}\nApplicable provisions (as entered): ${c.acts}\n\n`;if(/summari|previous|history|hearing/.test(low)&&!/checklist/.test(low))return base+`HEARING RECORD\n${(c.history||[]).map(h=>`• ${fmt(h[0])}: ${h[1]}`).join('\n')}\n\nLATEST SUMMARY\n${c.summary}\n\nNEXT STEP\nCross-check these notes with signed orders and the official cause list.`;if(/checklist|prepare/.test(low))return base+`HEARING PREPARATION CHECKLIST\n1. Verify listing, bench, courtroom and VC instructions on the official court website.\n2. Read the last signed order and identify directions due before ${fmt(c.date)}.\n3. Confirm pleadings, affidavits, exhibits and service status.\n4. Prepare a concise chronology, issues list and indexed authorities bundle.\n5. Confirm client instructions and counsel availability.\n\nThis is a general workflow, not a court-specific procedural determination.`;if(/argument|precedent|clause|section|act|research/.test(low))return base+`LEGAL RESEARCH FRAMEWORK\n1. Identify the precise statutory text, version in force and jurisdiction.\n2. Break down each element of the relevant provision and match it to admitted/disputed facts.\n3. Research binding Supreme Court and jurisdictional High Court decisions using verified legal databases.\n4. Anticipate counterarguments, limitation, maintainability and evidentiary objections.\n5. Prepare propositions with pinpoint citations after independent verification.\n\nNo specific precedent is asserted here because this demo has no live legal research database.`;return base+`POSSIBLE NEXT STRATEGIC STEPS\n1. Review the most recent signed order: ${c.summary}\n2. Identify the immediate objective for the ${c.stage.toLowerCase()} stage.\n3. Confirm filing deadlines, service requirements and the next listing with official court records.\n4. Organize factual chronology, key documents and legal issues under ${c.acts}.\n5. Discuss procedural options, risks and instructions with the client and supervising advocate.\n\nRESEARCH TO VERIFY\n• Current statutory language and procedural rules.\n• Binding precedents for the precise relief sought.\n• Court-specific practice directions and latest orders.\n\nThis is illustrative case-management support, not a definitive legal opinion.`}
function ask(q){let c=cases.find(x=>String(x.id)===String(chatCase))||cases[0];chat.push({role:'user',text:q},{role:'assistant',text:answer(q,c)});render();setTimeout(()=>{let el=document.getElementById('chat-scroll');if(el)el.scrollTop=el.scrollHeight},0)}
function openModal(id=null){editing=id;modal=true;render()}function closeModal(){modal=false;editing=null;render()}function modalHTML(){let c=cases.find(x=>x.id===editing)||{};const field=(label,name,value='',type='text',required=true)=>`<label class="form-field"><span>${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;return `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${editing?'Edit Case':'Add New Case'}</h2><button class="btn" onclick="closeModal()" aria-label="Close dialog">${ico('close')}</button></div><form id="case-form" onsubmit="submitCase(event)"><div class="modal-body"><div class="form-grid">${field('Case Number','num',c.num)}${field('Client Name','client',c.client)}${field('Case Topic','topic',c.topic)}${field('Court / Tribunal','court',c.court)}${field('Next Hearing Date','date',c.date,'date')}${field('Stage of Case','stage',c.stage)}${field('Presiding Judge','judge',c.judge)}${field('Judge Designation','designation',c.designation)}${field('Courtroom Number','room',c.room)}<label class="form-field"><span>Status</span><select name="status">${['Urgent','Pending','Listed','Disposed'].map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="form-field wide"><span>Applicable Acts / Sections (separate with semicolons)</span><textarea name="acts" rows="2">${esc(c.acts||'')}</textarea></label><label class="form-field wide"><span>Latest Hearing Summary</span><textarea name="summary" rows="3">${esc(c.summary||'')}</textarea></label></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${editing?'Save Changes':'Create Case'}</button></div></form></div></div>`}
function submitCase(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));if(editing){let i=cases.findIndex(c=>c.id===editing);cases[i]={...cases[i],...d}}else{let id=Math.max(0,...cases.map(c=>c.id))+1;cases.unshift({id,...d,history:[]});selected=id}save();modal=false;editing=null;nav('cases');toast('Case saved successfully')}
function addHearing(id){let c=cases.find(x=>x.id===id),date=prompt('Hearing date (YYYY-MM-DD):',new Date().toISOString().slice(0,10));if(date===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||isNaN(Date.parse(date))){toast('Enter a valid YYYY-MM-DD date');return}let summary=prompt('Hearing summary:');if(!summary?.trim())return;c.history=c.history||[];c.history.push([date,summary.trim()]);c.summary=summary.trim();save();render();toast('Hearing added')}
function editSummary(id){let c=cases.find(x=>x.id===id),s=prompt('Update latest hearing summary:',c.summary);if(s===null)return;c.summary=s;save();render();toast('Summary updated')}
function courtLink(){toast('No verified VC link saved. Check the official court website or cause list.')}
let detailTab='overview';
function showAlerts(){const urgent=cases.filter(c=>c.status==='Urgent');alert(urgent.length?`Urgent matters (${urgent.length}):\n`+urgent.map(c=>`${c.num} — ${c.client} — ${fmt(c.date)}`).join('\n'):'No urgent matters currently flagged.')}
function exportCases(){const columns=['num','client','court','date','stage','judge','designation','room','status','acts'];const csv=[columns.join(','),...cases.map(c=>columns.map(k=>'"'+String(c[k]||'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='nyayadesk-case-register.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function attachDocument(e,id){const file=e.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('Maximum file size is 10 MB');return}const c=cases.find(x=>x.id===id);if(!c)return;c.documents=c.documents||[];c.documents.push({name:file.name,size:(file.size/1024).toFixed(0)+' KB'});save();render();toast('Document reference added (file not stored)')}
function removeDocument(id,index){const c=cases.find(x=>x.id===id);if(!c)return;c.documents.splice(index,1);save();render()}

let loggedIn=false,clientsData=[],remindersData=[],documentsData=[],calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
async function api(path,opts={}){const res=await fetch(path,{credentials:'same-origin',headers:{...(opts.body&&typeof opts.body==='string'&&!opts.raw?{'Content-Type':'application/json'}:{}),...(opts.headers||{})},...opts});const ct=res.headers.get('content-type')||'';const data=ct.includes('application/json')?await res.json():null;if(!res.ok)throw Error(data?.error||'Request failed');return data}
function loginScreen(){root.innerHTML=`<div class="auth-wrap"><form class="auth-card" onsubmit="authSubmit(event)"><div class="auth-mark">⚖</div><h1>NyayaDesk</h1><p>Private advocate workspace · Brown & Ivory Edition</p><label>Email address<input class="input" type="email" name="email" required autocomplete="username" placeholder="advocate@example.com"></label><label>Password<input class="input" type="password" name="password" minlength="10" required autocomplete="current-password" placeholder="At least 10 characters"></label><button class="btn primary" style="width:100%;margin-top:18px" type="submit" id="login-button">Sign in</button><button class="link" style="width:100%;margin-top:15px" type="button" onclick="document.getElementById('login-button').textContent=document.getElementById('login-button').textContent==='Sign in'?'Create account':'Sign in'">Create account / Switch to sign in</button><p class="sub">Self-hosted demo. Use fictional information only until production security review.</p></form></div>`}
async function authSubmit(e){e.preventDefault();const f=e.target;const mode=document.getElementById('login-button').textContent==='Create account'?'register':'login';try{await api('/api/'+mode,{method:'POST',body:JSON.stringify({email:f.email.value,password:f.password.value})});loggedIn=true;await loadData();render()}catch(err){toast(err.message)}}
async function logout(){await api('/api/logout',{method:'POST'});loggedIn=false;cases=seed;render()}
async function loadData(){const [cs,cl,rm,dc]=await Promise.all([api('/api/cases'),api('/api/clients'),api('/api/reminders'),api('/api/documents')]);cases=cs.cases??structuredClone(seed);clientsData=cl.items;remindersData=rm.items;documentsData=dc.items;chatCase=String(cases[0]?.id||1)}
async function bootstrap(){try{const s=await api('/api/session');loggedIn=s.authenticated;if(loggedIn)await loadData()}catch(e){console.warn(e)}render()}
function clientsPage(){return header('Chamber relationships','Client Directory','Manage contact details and related matters.',`<button class="btn primary" onclick="clientForm()">＋ Add client</button>`)+`<div class="stats">${[['Clients',clientsData.length],['Linked case records',cases.length],['Active matters',cases.filter(c=>c.status!=='Disposed').length]].map(([n,v])=>`<div class="stat"><div class="stat-top">${n}</div><div class="stat-value">${v}</div></div>`).join('')}</div><section class="panel"><div class="panel-head"><h2>Client records</h2></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Email</th><th>Phone</th><th>Associated cases</th><th></th></tr></thead><tbody>${clientsData.map(c=>`<tr><td><b>${esc(c.name)}</b><span class="minor">${esc(c.notes||'')}</span></td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${cases.filter(x=>x.client.toLowerCase()===c.name.toLowerCase()).map(x=>`<button class="link" onclick="openCase(${x.id})">${esc(x.num)}</button>`).join(', ')||'—'}</td><td><button class="link" onclick="removeRecord('clients',${c.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No clients yet. Add your first client above.</td></tr>'}</tbody></table></div></section>`}
function clientForm(){openCustom(`<h2>Add client</h2><form onsubmit="event.preventDefault();submitClient(this)"><label>Full name<input name="name" required maxlength="150"></label><label>Email<input type="email" name="email"></label><label>Phone<input name="phone"></label><label>Notes<textarea name="notes"></textarea></label><button class="btn primary">Save client</button></form>`)}
async function submitClient(f){try{await api('/api/clients',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});closeCustom();await loadData();render();toast('Client added')}catch(e){toast(e.message)}}
function documentsPage(){return header('Secure files','Document Management','Files are stored on your local backend and linked to matters.')+`<section class="panel" style="padding:22px"><div class="panel-head"><h2>Upload document</h2></div><form class="file-form" onsubmit="uploadDocument(event)"><select class="select" name="case_id" required>${cases.map(c=>`<option value="${c.id}">${esc(c.num)} · ${esc(c.client)}</option>`).join('')}</select><input type="file" name="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.txt" required><button class="btn primary">Upload file</button></form><p class="sub">Maximum 10 MB per file. Downloads require an authenticated session.</p></section><section class="panel" style="margin-top:20px"><div class="panel-head"><h2>Stored documents</h2><span class="sub">${documentsData.length} files</span></div><div class="table-wrap"><table><thead><tr><th>File name</th><th>Case</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>${documentsData.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(cases.find(c=>c.id===d.case_id)?.num||'Case '+d.case_id)}</td><td>${Math.round(d.size/1024)} KB</td><td>${esc(d.created)}</td><td><a class="link" href="/api/documents/${d.id}">Download</a> · <button class="link" onclick="removeRecord('documents',${d.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No documents uploaded yet.</td></tr>'}</tbody></table></div></section>`}
async function uploadDocument(e){e.preventDefault();const f=e.target, file=f.file.files[0];if(!file)return;if(file.size>10000000)return toast('Maximum file size is 10 MB');try{await api('/api/documents?case_id='+encodeURIComponent(f.case_id.value)+'&name='+encodeURIComponent(file.name),{method:'POST',body:file,raw:true,headers:{'Content-Type':'application/octet-stream'}});await loadData();render();toast('Document uploaded')}catch(err){toast(err.message)}}
function causeList(){const today=new Date().toISOString().slice(0,10);const list=cases.filter(c=>c.status!=='Disposed').sort((a,b)=>a.date.localeCompare(b.date));return header('Daily court schedule','Cause List Workspace','A chamber-organized list based on saved cases. Not an official court cause list.')+`<div class="notice" style="margin-bottom:18px"><strong>Verification required</strong><p>Item numbers, court changes and official listing status must be checked against the relevant court’s published cause list. This is not a live eCourts feed.</p></div><section class="panel"><div class="panel-head"><h2>Chamber cause list</h2><button class="btn" onclick="window.print()">Print</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Matter</th><th>Court</th><th>Presiding Judge</th><th>Room</th><th>Status</th></tr></thead><tbody>${list.map(c=>`<tr onclick="openCase(${c.id})"><td>${fmt(c.date)}</td><td><b>${esc(c.num)}</b><span class="minor">${esc(c.client)}</span></td><td>${esc(c.court)}</td><td>${esc(c.judge)}</td><td>${esc(c.room)}</td><td>${status(c.status)}</td></tr>`).join('')}</tbody></table></div></section>`}
function remindersPage(){return header('Practice planning','Reminders & Tasks','Track deadlines and preparation tasks.',`<button class="btn primary" onclick="reminderForm()">＋ Add reminder</button>`)+`<section class="panel"><div class="panel-head"><h2>Upcoming tasks</h2></div><div class="small-list">${remindersData.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(r=>`<div class="hearing-row"><div class="datebox"><b>${r.due.slice(8)}</b><small>${r.due.slice(5,7)}/${r.due.slice(0,4)}</small></div><div class="grow"><strong>${esc(r.description)}</strong><p>${esc(cases.find(c=>c.id===r.case_id)?.num||'General task')} · ${r.due<new Date().toISOString().slice(0,10)?'Overdue':'Scheduled'}</p></div><button class="link" onclick="removeRecord('reminders',${r.id})">Complete / Remove</button></div>`).join('')||'<p class="sub" style="padding:20px">No reminders yet.</p>'}</div></section>`}
function reminderForm(){openCustom(`<h2>New reminder</h2><form onsubmit="event.preventDefault();submitReminder(this)"><label>Task description<input name="description" required></label><label>Due date<input name="due" type="date" required></label><label>Related case<select name="case_id"><option value="">General task</option>${cases.map(c=>`<option value="${c.id}">${esc(c.num)}</option>`).join('')}</select></label><button class="btn primary">Save reminder</button></form>`)}
async function submitReminder(f){const b=Object.fromEntries(new FormData(f));b.case_id=b.case_id?Number(b.case_id):null;try{await api('/api/reminders',{method:'POST',body:JSON.stringify(b)});closeCustom();await loadData();render();toast('Reminder saved')}catch(e){toast(e.message)}}
async function removeRecord(table,id){if(!confirm('Remove this record?'))return;try{await api('/api/'+table+'?id='+id,{method:'DELETE'});await loadData();render()}catch(e){toast(e.message)}}
function openCustom(html){document.getElementById('custom-modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="custom-backdrop" id="custom-modal" onclick="if(event.target===this)closeCustom()"><div class="custom-dialog"><button class="custom-close" onclick="closeCustom()" aria-label="Close">✕</button>${html}</div></div>`)}
function closeCustom(){document.getElementById('custom-modal')?.remove()}
async function askAI(q){const c=cases.find(x=>String(x.id)===String(chatCase))||cases[0];chat.push({role:'user',text:q});chat.push({role:'assistant',text:'Researching case context…'});render();try{const r=await api('/api/assistant',{method:'POST',body:JSON.stringify({question:q,case:c})});chat[chat.length-1].text=r.answer;render()}catch(e){chat[chat.length-1].text='Assistant unavailable: '+e.message;render()}}
function ask(q){askAI(q)}
function render(){if(!loggedIn){loginScreen();return}shell(({dashboard,cases:casesPage,detail,hearings,assistant,clients:clientsPage,documents:documentsPage,causelist:causeList,reminders:remindersPage})[view]())}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});bootstrap();
</script></body></html>
